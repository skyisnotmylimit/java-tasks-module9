global:
  scrape_interval: 5s

scrape_configs:
  - job_name: micro-sender
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["micro-sender:8081"]

  - job_name: micro-recipient
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["micro-recipient:8082"]

  # DNS service discovery returns every replica of micro-collector in a single job
  - job_name: micro-collector
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["micro-collector"]
        type: A
        port: 8083

  - job_name: micro-visualizer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["micro-visualizer:8084"]
