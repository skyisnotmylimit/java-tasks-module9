server.port=8083
spring.application.name=micro-collector
recipient.url=${RECIPIENT_URL:http://localhost:8082}
# M seconds (M > N)
collector.interval-seconds=${COLLECT_INTERVAL_SECONDS:10}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/messages}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
# Per-replica label so Prometheus can tell replicas apart
management.metrics.tags.instance_id=${HOSTNAME:local}
