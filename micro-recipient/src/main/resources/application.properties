server.port=8082
spring.application.name=micro-recipient
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# N seconds
recipient.poll-interval-seconds=${POLL_INTERVAL_SECONDS:5}
# task 18: v2 returns one message per GET /message call
recipient.single-message-per-call=${SINGLE_MESSAGE_PER_CALL:false}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
